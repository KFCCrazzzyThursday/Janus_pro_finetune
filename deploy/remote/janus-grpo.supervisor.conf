[program:janus-grpo]
command=/bin/bash /workspace/Janus_pro_finetune/deploy/remote/run_stage1_grpo.sh
directory=/workspace/Janus_pro_finetune
autostart=false
autorestart=unexpected
startsecs=30
startretries=2
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=120
stdout_logfile=/workspace/Janus_pro_finetune/outputs/stage1/tqa_grpo_blackwell/supervisor.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=3
redirect_stderr=true
environment=HOME="/root",USER="root"
