[program:janus-grpo]
environment=PROC_NAME="%(program_name)s"
command=/opt/supervisor-scripts/janus-grpo.sh
directory=/workspace/Janus_pro_finetune
autostart=false
autorestart=unexpected
startsecs=30
startretries=2
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=120
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
